name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */3 * *'   # cada 3 días a las 12:00 UTC
  workflow_dispatch:          # también lo podés correr a mano desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la tabla resultados
        run: |
          curl "https://fcjypliqiccjdaualcrk.supabase.co/rest/v1/resultados?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
